<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TBTECH VWM - Hệ Thống Quản Lý Kho & Chứng Từ Doanh Nghiệp</title>
  <meta name="description" content="TBTECH VWM - Hệ thống quản lý kho & chứng từ chuyên nghiệp, quét đọc hóa đơn PDF bằng AI, xuất phiếu kho 02-VT, biên bản bàn giao và hợp đồng mua bán khổ chuẩn A4." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232563eb'><path d='M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4'/></svg>" type="image/svg+xml">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            mono: ['Space Grotesk', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Chart.js, SheetJS (Excel), PDF.js & Google Identity Services -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body class="bg-slate-50 text-slate-900 antialiased min-h-screen flex flex-col selection:bg-blue-600 selection:text-white">

  <!-- ==========================================================================
       HEADER & NAVIGATION BAR
       ========================================================================== -->
  <header class="bg-slate-950 text-white sticky top-0 z-40 border-b border-slate-800/80 shadow-lg no-print">
    <!-- Top Brand Bar -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3.5">
      <div class="flex items-center justify-between gap-4">
        <!-- Logo & Company Brand -->
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('dashboard')">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-blue-500/25 border border-blue-400/30">
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
            </svg>
          </div>
          <div>
            <div class="flex items-center space-x-2">
              <span class="font-black text-lg tracking-wider text-white font-mono">TBTECH VWM</span>
              <span class="bg-blue-500/15 border border-blue-400/30 text-blue-300 text-[10px] font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">
                Kho Trung Tâm
              </span>
            </div>
            <p class="text-xs text-slate-400 font-medium">Hệ Thống Quản Lý Kho & Chứng Từ</p>
          </div>
        </div>

        <!-- Global Search Bar & Stats Counter -->
        <div class="flex items-center space-x-2 sm:space-x-4 text-xs">
          <!-- Global Search (Ctrl+K) -->
          <div class="relative hidden md:block w-56 lg:w-72">
            <svg class="w-4 h-4 text-slate-500 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
            <input 
              type="text" 
              id="global-search" 
              placeholder="Tìm kiếm nhanh... (Ctrl+K)" 
              oninput="handleSearchInventory(this.value); if(AppState.currentTab !== 'inventory') switchTab('inventory');" 
              class="w-full pl-9 pr-8 py-1.5 bg-slate-900 border border-slate-800 rounded-xl text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 transition"
            />
            <kbd class="absolute right-2.5 top-1/2 -translate-y-1/2 text-[10px] font-mono text-slate-500 bg-slate-800 px-1.5 py-0.5 rounded border border-slate-700">⌘K</kbd>
          </div>

          <!-- Counter 1: SKUs -->
          <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3.5 py-2 rounded-2xl flex items-center space-x-2.5 shadow-xs transition">
            <div class="w-7 h-7 rounded-xl bg-blue-500/15 flex items-center justify-center text-blue-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path>
              </svg>
            </div>
            <div>
              <span class="text-slate-400 text-[10px] uppercase font-semibold tracking-wider block leading-none">Mặt hàng</span>
              <span id="header-sku-count" class="font-bold text-white text-xs font-mono">12 SKUs</span>
            </div>
          </div>

          <!-- Counter 2: Total Stock -->
          <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3.5 py-2 rounded-2xl flex items-center space-x-2.5 shadow-xs transition">
            <div class="w-7 h-7 rounded-xl bg-emerald-500/15 flex items-center justify-center text-emerald-400">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
              </svg>
            </div>
            <div>
              <span class="text-slate-400 text-[10px] uppercase font-semibold tracking-wider block leading-none">Tổng tồn</span>
              <span id="header-stock-count" class="font-bold text-white text-xs font-mono">110 thiết bị</span>
            </div>
          </div>

          <!-- Auto-Mail Poller Status Indicator -->
          <div id="header-mail-status" onclick="switchTab('gmail_sync')" title="Trạng thái tự động quét email kế toán (Click để cài đặt)" class="hidden sm:flex items-center space-x-2 px-3 py-1.5 rounded-2xl bg-emerald-950/70 border border-emerald-500/40 text-emerald-400 text-xs cursor-pointer hover:bg-emerald-900/60 transition shadow-xs">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span class="text-[11px] font-bold font-mono">Mail Auto: ON</span>
          </div>

          <!-- Audio Toggle -->
          <button onclick="toggleAudio()" title="Bật/Tắt âm thanh hiệu ứng" class="p-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-slate-400 hover:text-white border border-slate-800 transition cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path>
            </svg>
          </button>
        </div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 border-t border-slate-800/80">
      <nav class="flex flex-wrap lg:flex-nowrap items-center gap-1.5 sm:gap-2 py-2.5 no-scrollbar overflow-x-auto scroll-smooth">
        <!-- Dashboard -->
        <button id="tab-dashboard" onclick="switchTab('dashboard')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer bg-blue-600 text-white shadow-md shadow-blue-600/25 border border-blue-500">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          <span>Tổng Quan</span>
        </button>

        <!-- Inventory -->
        <button id="tab-inventory" onclick="switchTab('inventory')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          <span>Kho Hàng Tbtech</span>
        </button>

        <!-- Invoice Reader (OCR) -->
        <button id="tab-invoice_reader" onclick="switchTab('invoice_reader')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Hóa đơn pdf</span>
          <span class="bg-amber-400/20 text-amber-300 text-[10px] px-1.5 py-0.5 rounded-md font-mono font-bold">OCR</span>
        </button>

        <!-- Gmail Sync (Auto Poller) -->
        <button id="tab-gmail_sync" onclick="switchTab('gmail_sync')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <span>Đọc email kế toán</span>
          <span class="bg-emerald-400/20 text-emerald-300 text-[10px] px-1.5 py-0.5 rounded-md font-mono font-bold">Tự Động</span>
        </button>

        <!-- Reconciliation & Audit (MỚI: Đối Soát Vào - Ra & Cảnh Báo Lệch Tên) -->
        <button id="tab-reconciliation" onclick="switchTab('reconciliation')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 14l6-6m-5.5.5h.01m4.99 5h.01M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16l3.5-2 3.5 2 3.5-2 3.5 2zM10 8.5a.5.5 0 11-1 0 .5.5 0 011 0zm5 5a.5.5 0 11-1 0 .5.5 0 011 0z"></path></svg>
          <span>Đối Soát Vào - Ra</span>
          <span class="bg-rose-500/20 text-rose-300 text-[10px] px-1.5 py-0.5 rounded-md font-mono font-bold">Soát Kho</span>
        </button>

        <!-- Documents -->
        <button id="tab-documents" onclick="switchTab('documents')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
          <span>Chứng từ</span>
        </button>

        <!-- Customers -->
        <button id="tab-customers" onclick="switchTab('customers')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          <span>Quản Lý Khách Hàng</span>
        </button>

        <!-- History Log -->
        <button id="tab-history_log" onclick="switchTab('history_log')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 cursor-pointer text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>Lịch Sử Xuất/Nhập</span>
        </button>

        <!-- Settings -->
        <button id="tab-settings" onclick="switchTab('settings')" class="flex items-center space-x-2 px-3 sm:px-3.5 py-2 rounded-xl text-xs sm:text-sm font-semibold whitespace-nowrap shrink-0 transition-all cursor-pointer lg:ml-auto text-slate-400 hover:text-slate-200 hover:bg-slate-900 border border-transparent">
          <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          <span>Cài Đặt & Doanh Nghiệp</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- ==========================================================================
       MAIN CONTENT CONTAINER
       ========================================================================== -->
  <main id="main-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
    <!-- Nội dung được ứng dụng render động ở đây -->
  </main>

  <!-- ==========================================================================
       FOOTER
       ========================================================================== -->
  <footer class="bg-white border-t border-slate-200/80 py-6 mt-auto no-print">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-xs text-slate-500">
      <div class="flex items-center space-x-2">
        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
        <span class="font-bold text-slate-800 font-mono tracking-wider">TBTECH WMS</span>
        <span>© 2026 CÔNG TY TNHH THIẾT BỊ VÀ VẬT TƯ CÔNG NGHIỆP TBTECH</span>
      </div>
      <div class="font-medium text-slate-400">
        Hỗ trợ máy in chuẩn A4 (Phiếu Xuất Kho 02-VT • Biên Bản Bàn Giao • Hợp Đồng Mua Bán)
      </div>
    </div>
  </footer>

  <!-- Modal Root for Gmail Connect & Overlays -->
  <div id="gmail-modal-root"></div>

  <!-- Scripts -->
  <script src="./js/data.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
